<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qabilet — узнайте, подходит ли вам процедура</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 64'%3E%3Cpath d='M6 28 Q58 2 120 46 Q58 26 6 28 Z' fill='%232E7D58'/%3E%3Cpath d='M234 28 Q182 2 120 46 Q182 26 234 28 Z' fill='%231E3A5F'/%3E%3C/svg%3E">
<style>
:root{
  --blue:#1E3A5F;--green:#2E7D58;--amber:#E8A94A;--mint:#E8F4EE;
  --ink:#2C2C2A;--ink-soft:#5F5E5A;--line:#DCE4E0;--line-soft:#EDF1EF;--white:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#fff;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,.bf{font-family:Onest,Inter,-apple-system,sans-serif}
.in{max-width:760px;margin:0 auto;padding:0 20px}

/* header */
.top{background:var(--blue);color:#fff;padding:16px 0;position:sticky;top:0;z-index:40}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand svg{width:52px;flex:none;display:block}
.brand .nm{font-family:Onest;font-weight:700;font-size:21px;line-height:1;letter-spacing:-.01em}
.brand .sb{font-size:11px;color:#AFC0D4;margin-top:2px;line-height:1.3}
@media(max-width:520px){.brand .sb{display:none}.brand svg{width:42px}}
.lang{display:flex;border:1px solid rgba(255,255,255,.3);border-radius:999px;overflow:hidden;flex:none}
.lang button{background:transparent;border:0;color:#C7D6E6;font-family:Onest;font-weight:600;font-size:12.5px;padding:7px 13px;cursor:pointer}
.lang button.on{background:#fff;color:var(--blue)}

/* hero */
.hero{background:var(--mint);padding:44px 0 40px;text-align:center}
.hero .bird{width:76px;margin:0 auto 16px;display:block}
.hero h1{font-size:32px;font-weight:600;color:var(--blue);margin:0 0 12px;line-height:1.2;letter-spacing:-.02em}
.hero p{margin:0 auto;max-width:56ch;color:#3C5245;font-size:16.5px}
.hero .slog{margin-top:20px;font-family:Onest;font-weight:600;color:var(--green);font-size:15px}
@media(max-width:520px){.hero h1{font-size:26px}.hero{padding:32px 0 30px}}

/* blocks */
.sec{padding:40px 0}
.sec.alt{background:#FBFDFC;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.sec h2{font-size:22px;font-weight:600;color:var(--blue);margin:0 0 8px;letter-spacing:-.01em}
.sec .lead{color:var(--ink-soft);margin:0 0 22px;font-size:15.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 19px}
.tile h3{font-size:16px;margin:0 0 6px;color:var(--blue);font-weight:600}
.tile p{margin:0;font-size:14.5px;color:var(--ink-soft);line-height:1.55}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:14px;align-items:flex-start}
.step .b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--mint);color:var(--green);font-family:Onest;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.step p{margin:0;font-size:15px}
.step p b{display:block;color:var(--blue);font-weight:600}
.note-amber{margin-top:22px;background:#FDF7EC;border:1px solid rgba(232,169,74,.45);border-radius:12px;padding:16px 18px;font-size:14.5px;color:#5A4718;line-height:1.6}
.note-amber b{color:#8A6A22}

/* wizard */
.wiz{padding:38px 0 60px}
.bar{height:5px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-bottom:9px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;width:0;transition:width .4s cubic-bezier(.4,0,.2,1)}
.barlab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-bottom:24px}
.stp{display:none}
.stp.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stp > h2{font-size:23px;font-weight:600;color:var(--blue);margin:0 0 6px;letter-spacing:-.01em}
.stp > .sub{color:var(--ink-soft);font-size:15px;margin:0 0 26px}

.q{margin-bottom:28px}
.q > label,.q > .qt{display:block;font-family:Onest;font-weight:600;font-size:17px;color:var(--ink);margin-bottom:5px;line-height:1.35}
.q .exp{display:block;font-size:14px;color:var(--ink-soft);margin-bottom:12px;line-height:1.5}
.ch{display:flex;flex-direction:column;gap:8px}
.ch label{display:flex;gap:12px;align-items:flex-start;padding:14px 15px;border:1.5px solid var(--line);border-radius:11px;cursor:pointer;transition:.13s background,.13s border-color}
.ch label:hover{border-color:#BBCEC4;background:#FBFDFC}
.ch label.on{background:var(--mint);border-color:var(--green)}
.ch input{margin:3px 0 0;width:19px;height:19px;flex:none;accent-color:var(--green);cursor:pointer}
.ch span{font-size:15.5px;line-height:1.45}
.ch span small{display:block;font-size:13.5px;color:var(--ink-soft);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chips label{display:inline-flex;align-items:center;gap:8px;padding:11px 15px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer;font-size:15px;transition:.13s}
.chips label:hover{border-color:#BBCEC4}
.chips label.on{background:var(--mint);border-color:var(--green);color:#255C43}
.chips input{width:17px;height:17px;accent-color:var(--green);margin:0}

.fld{display:flex;border:1.5px solid var(--line);border-radius:11px;background:#fff;transition:.15s}
.fld:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(46,125,88,.13)}
.fld input{flex:1;min-width:0;border:0;background:transparent;padding:14px 15px;font:inherit;font-size:17px;font-weight:500;color:var(--blue);outline:none}
.fld input::placeholder{color:#B7BEBA;font-weight:400}
.fld .u{display:flex;align-items:center;padding:0 15px;border-left:1px solid var(--line-soft);font-size:14px;color:var(--ink-soft);background:#FBFDFC;border-radius:0 9px 9px 0}
.fld.txt input{text-align:left}
.fld input[inputmode=numeric]{text-align:right}

.nav{display:flex;gap:11px;align-items:center;margin-top:30px;flex-wrap:wrap}
button.btn{font-family:Onest;font-weight:600;font-size:16px;padding:15px 30px;border-radius:11px;border:1.5px solid var(--line);background:#fff;color:var(--blue);cursor:pointer;transition:.13s}
button.btn:hover{background:#FBFDFC;border-color:#BBCEC4}
button.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
button.btn.pri:hover{background:#256647;border-color:#256647}
button.btn:focus-visible{outline:2px solid var(--green);outline-offset:2px}
button.btn:active{transform:translateY(1px)}
.warn{font-size:14px;color:#8A6A22;font-weight:500;margin-top:12px}

.agree{display:flex;gap:11px;align-items:flex-start;margin-top:6px;font-size:13.8px;color:var(--ink-soft);line-height:1.5}
.agree input{margin:3px 0 0;width:19px;height:19px;flex:none;accent-color:var(--green)}

/* thanks */
.thx{display:none;text-align:center;padding:20px 0 10px}
.thx.on{display:block;animation:fade .3s ease}
.thx .ic{width:74px;height:74px;border-radius:50%;background:var(--mint);margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
.thx .ic svg{width:40px}
.thx h2{font-size:27px;color:var(--blue);margin:0 0 12px;font-weight:600}
.thx p{color:var(--ink-soft);max-width:48ch;margin:0 auto 10px;font-size:16px}
.thx .card{margin-top:26px;background:var(--mint);border-radius:14px;padding:22px;text-align:left}
.thx .card b{font-family:Onest;color:var(--blue);display:block;margin-bottom:7px;font-size:16px}
.thx .card p{color:#39503F;margin:0;max-width:none;font-size:15px}
.calc{margin-top:26px;border:1.5px solid var(--green);border-radius:14px;overflow:hidden;text-align:left}
.calc-h{background:var(--green);color:#fff;font-family:Onest;font-weight:600;font-size:15.5px;padding:13px 18px}
.calc-t{width:100%;border-collapse:collapse;background:#fff}
.calc-t tr{border-top:1px solid var(--line-soft)}
.calc-t tr:first-child{border-top:0}
.calc-t th{text-align:left;font-weight:400;color:var(--ink-soft);padding:12px 18px;font-size:14.5px;line-height:1.4}
.calc-t td{text-align:right;padding:12px 18px;font-weight:600;color:var(--blue);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:15.5px}
.calc-t tr.big th{color:var(--ink);font-weight:500;font-size:15px}
.calc-t tr.big td{font-family:Onest;font-size:22px;color:var(--green);font-weight:700}
.calc-t tr.hl{background:#F7FBF9}
.calc-t tr.hl td{color:var(--green)}
.calc-n{margin:0;padding:14px 18px;background:#FBFDFC;border-top:1px solid var(--line-soft);font-size:12.8px;color:var(--ink-soft);line-height:1.55}
@media(max-width:430px){.calc-t th,.calc-t td{padding:11px 13px;font-size:14px}.calc-t tr.big td{font-size:19px}}
.send{margin-top:22px;display:flex;flex-direction:column;gap:10px;align-items:center}
.send small{color:var(--ink-soft);font-size:13.5px;max-width:44ch}

footer{background:var(--blue);color:#B9C7D8;padding:34px 0 40px;font-size:13.5px;line-height:1.7}
footer b{color:#fff;font-family:Onest}
footer a{color:#C9DCF0}
.own{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.15);font-size:12.5px;color:#95A8BF}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="top">
  <div class="in">
    <div class="brand">
      <svg viewBox="0 0 240 64" role="img" aria-label="Qabilet">
        <path d="M6 28 Q58 2 120 46 Q58 26 6 28 Z" fill="#4E9E74"/>
        <path d="M234 28 Q182 2 120 46 Q182 26 234 28 Z" fill="#A8C0E0"/>
      </svg>
      <div><div class="nm">Qabilet</div><div class="sb" data-i="tag"></div></div>
    </div>
    <div class="lang">
      <button type="button" id="lRu" class="on">RU</button>
      <button type="button" id="lKz">ҚАЗ</button>
    </div>
  </div>
</div>

<!-- ===== HERO ===== -->
<div class="hero" id="hero">
  <div class="in">
    <svg class="bird" viewBox="0 0 240 64" aria-hidden="true">
      <path d="M6 28 Q58 2 120 46 Q58 26 6 28 Z" fill="#2E7D58"/>
      <path d="M234 28 Q182 2 120 46 Q182 26 234 28 Z" fill="#1E3A5F"/>
    </svg>
    <h1 data-i="heroH"></h1>
    <p data-i="heroP"></p>
    <div class="slog" data-i="slogan"></div>
  </div>
</div>

<!-- ===== О ПРОЦЕДУРЕ ===== -->
<section class="sec" id="about1">
  <div class="in">
    <h2 data-i="aboutH"></h2>
    <p class="lead" data-i="aboutL"></p>
    <div class="grid">
      <div class="tile"><h3 data-i="t1h"></h3><p data-i="t1p"></p></div>
      <div class="tile"><h3 data-i="t2h"></h3><p data-i="t2p"></p></div>
      <div class="tile"><h3 data-i="t3h"></h3><p data-i="t3p"></p></div>
      <div class="tile"><h3 data-i="t4h"></h3><p data-i="t4p"></p></div>
    </div>
    <div class="note-amber"><b data-i="honestH"></b> <span data-i="honestP"></span></div>
  </div>
</section>

<!-- ===== КАК ПРОХОДИТ ===== -->
<section class="sec alt" id="about2">
  <div class="in">
    <h2 data-i="howH"></h2>
    <p class="lead" data-i="howL"></p>
    <div class="steps">
      <div class="step"><div class="b">1</div><p><b data-i="s1h"></b><span data-i="s1p"></span></p></div>
      <div class="step"><div class="b">2</div><p><b data-i="s2h"></b><span data-i="s2p"></span></p></div>
      <div class="step"><div class="b">3</div><p><b data-i="s3h"></b><span data-i="s3p"></span></p></div>
      <div class="step"><div class="b">4</div><p><b data-i="s4h"></b><span data-i="s4p"></span></p></div>
    </div>
  </div>
</section>

<!-- ===== О КОМПАНИИ ===== -->
<section class="sec" id="about3">
  <div class="in">
    <h2 data-i="coH"></h2>
    <p class="lead" id="coLead"></p>
    <div class="grid">
      <div class="tile"><h3 data-i="c1h"></h3><p data-i="c1p"></p></div>
      <div class="tile"><h3 data-i="c2h"></h3><p data-i="c2p"></p></div>
      <div class="tile"><h3 data-i="c3h"></h3><p id="c3p"></p></div>
    </div>
  </div>
</section>

<!-- ===== АНКЕТА ===== -->
<section class="wiz alt" style="background:#FBFDFC;border-top:1px solid var(--line-soft)">
  <div class="in">

    <div id="wizBox">
      <h2 style="font-size:24px;color:var(--blue);margin:0 0 6px" data-i="formH"></h2>
      <p style="color:var(--ink-soft);margin:0 0 22px;font-size:15.5px" data-i="formL"></p>

      <div class="bar"><i id="barFill"></i></div>
      <div class="barlab"><span id="barStep"></span><span id="barMin" data-i="barMin"></span></div>

      <!-- ШАГ 1 -->
      <div class="stp on" data-s="1">
        <h2 data-i="p1h"></h2>
        <p class="sub" data-i="p1s"></p>

        <div class="q"><span class="qt" data-i="q1"></span><span class="exp" data-i="q1e"></span>
          <div class="ch" data-g="ip">
            <label><input type="radio" name="ip" value="no"><span data-i="q1a"></span></label>
            <label><input type="radio" name="ip" value="yes"><span data-i="q1b"></span></label>
          </div></div>

        <div class="q"><span class="qt" data-i="q2"></span>
          <div class="ch" data-g="pay">
            <label><input type="radio" name="pay" value="ok"><span data-i="q2a"></span></label>
            <label><input type="radio" name="pay" value="late"><span data-i="q2b"></span></label>
            <label><input type="radio" name="pay" value="stop"><span data-i="q2c"></span></label>
          </div></div>

        <div class="q"><span class="qt" data-i="q3"></span>
          <div class="ch" data-g="over">
            <label><input type="radio" name="over" value="no"><span data-i="q3a"></span></label>
            <label><input type="radio" name="over" value="s6"><span data-i="q3b"></span></label>
            <label><input type="radio" name="over" value="s12"><span data-i="q3c"></span></label>
            <label><input type="radio" name="over" value="l12"><span data-i="q3d"></span></label>
          </div></div>

        <div class="q"><label for="debt" data-i="q4"></label><span class="exp" data-i="q4e"></span>
          <div class="fld"><input id="debt" type="text" inputmode="numeric" placeholder="3 500 000"><span class="u">₸</span></div></div>

        <div class="q"><label for="curpay" data-i="q4b"></label><span class="exp" data-i="q4be"></span>
          <div class="fld"><input id="curpay" type="text" inputmode="numeric" placeholder="180 000"><span class="u">₸</span></div></div>

        <div class="q"><span class="qt" data-i="q5"></span>
          <div class="ch" data-g="cnt">
            <label><input type="radio" name="cnt" value="a"><span data-i="q5a"></span></label>
            <label><input type="radio" name="cnt" value="b"><span data-i="q5b"></span></label>
            <label><input type="radio" name="cnt" value="c"><span data-i="q5c"></span></label>
          </div></div>

        <div class="nav"><button class="btn pri" type="button" data-next data-i="btnNext"></button></div>
        <div class="warn" data-w></div>
      </div>

      <!-- ШАГ 2 -->
      <div class="stp" data-s="2">
        <h2 data-i="p2h"></h2>
        <p class="sub" data-i="p2s"></p>

        <div class="q"><label for="income" data-i="q6"></label><span class="exp" data-i="q6e"></span>
          <div class="fld"><input id="income" type="text" inputmode="numeric" placeholder="250 000"><span class="u">₸</span></div></div>

        <div class="q"><span class="qt" data-i="q7"></span><span class="exp" data-i="q7e"></span>
          <div class="ch" data-g="proof">
            <label><input type="radio" name="proof" value="spr"><span data-i="q7a"></span></label>
            <label><input type="radio" name="proof" value="part"><span data-i="q7b"></span></label>
            <label><input type="radio" name="proof" value="no"><span data-i="q7c"></span></label>
          </div></div>

        <div class="q"><label for="deps" data-i="q8"></label><span class="exp" data-i="q8e"></span>
          <div class="fld"><input id="deps" type="text" inputmode="numeric" placeholder="0"><span class="u" data-i="unitP"></span></div></div>

        <div class="q"><span class="qt" data-i="q9"></span><span class="exp" data-i="q9e"></span>
          <div class="ch" data-g="susn">
            <label><input type="radio" name="susn" value="yes"><span data-i="q9a"></span></label>
            <label><input type="radio" name="susn" value="no"><span data-i="q9b"></span></label>
          </div></div>

        <div class="nav"><button class="btn" type="button" data-prev data-i="btnBack"></button><button class="btn pri" type="button" data-next data-i="btnNext"></button></div>
        <div class="warn" data-w></div>
      </div>

      <!-- ШАГ 3 -->
      <div class="stp" data-s="3">
        <h2 data-i="p3h"></h2>
        <p class="sub" data-i="p3s"></p>

        <div class="q"><span class="qt" data-i="q10"></span>
          <div class="ch" data-g="home">
            <label><input type="radio" name="home" value="no"><span data-i="q10a"></span></label>
            <label><input type="radio" name="home" value="one"><span data-i="q10b"></span></label>
            <label><input type="radio" name="home" value="many"><span data-i="q10c"></span></label>
          </div></div>

        <div class="q"><span class="qt" data-i="q11"></span><span class="exp" data-i="q11e"></span>
          <div class="ch" data-g="prop">
            <label><input type="radio" name="prop" value="no"><span data-i="q11a"></span></label>
            <label><input type="radio" name="prop" value="one"><span data-i="q11b"></span></label>
            <label><input type="radio" name="prop" value="many"><span data-i="q11c"></span></label>
          </div></div>

        <div class="q"><span class="qt" data-i="q12"></span><span class="exp" data-i="q12e"></span>
          <div class="ch" data-g="pledge">
            <label><input type="radio" name="pledge" value="no"><span data-i="q12a"></span></label>
            <label><input type="radio" name="pledge" value="yes"><span data-i="q12b"></span></label>
          </div></div>

        <div class="q"><span class="qt" data-i="q13"></span><span class="exp" data-i="q13e"></span>
          <div class="ch" data-g="sold">
            <label><input type="radio" name="sold" value="no"><span data-i="q13a"></span></label>
            <label><input type="radio" name="sold" value="yes"><span data-i="q13b"></span></label>
          </div></div>

        <div class="q" id="soldWhy" style="display:none"><span class="qt" data-i="q13w"></span><span class="exp" data-i="q13we"></span>
          <div class="ch" data-g="soldw">
            <label><input type="radio" name="soldw" value="loan"><span data-i="q13w1"></span></label>
            <label><input type="radio" name="soldw" value="other"><span data-i="q13w2"></span></label>
          </div></div>

        <div class="nav"><button class="btn" type="button" data-prev data-i="btnBack"></button><button class="btn pri" type="button" data-next data-i="btnNext"></button></div>
        <div class="warn" data-w></div>
      </div>

      <!-- ШАГ 4 -->
      <div class="stp" data-s="4">
        <h2 data-i="p4h"></h2>
        <p class="sub" data-i="p4s"></p>

        <div class="q"><span class="qt" data-i="q14"></span><span class="exp" data-i="q14e"></span>
          <div class="chips" id="goals">
            <label><input type="checkbox" value="med"><span data-i="g1"></span></label>
            <label><input type="checkbox" value="edu"><span data-i="g2"></span></label>
            <label><input type="checkbox" value="home"><span data-i="g3"></span></label>
            <label><input type="checkbox" value="fam"><span data-i="g4"></span></label>
            <label><input type="checkbox" value="biz"><span data-i="g5"></span></label>
            <label><input type="checkbox" value="refi"><span data-i="g6"></span></label>
            <label><input type="checkbox" value="buy"><span data-i="g7"></span></label>
            <label><input type="checkbox" value="lux"><span data-i="g8"></span></label>
            <label><input type="checkbox" value="idk"><span data-i="g9"></span></label>
          </div></div>

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function t(k){return (T[lang]&&T[lang][k])||T.ru[k]||''}
function fmtNum(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function clean(s){s=String(s).replace(/ /g,' ');s=s.replace(/[.,]\d{1,2}\s*$/,'');return s.replace(/\D/g,'')}
function numOf(id){var v=clean($(id).value);return v?parseInt(v,10):0}
function money(n){return fmtNum(Math.round(n))+' ₸'}
function radio(name){var e=document.querySelector('input[name="'+name+'"]:checked');return e?e.value:''}
function radioLabel(name){var e=document.querySelector('input[name="'+name+'"]:checked');return e?e.parentNode.querySelector('span').textContent:'—'}

function applyLang(){
  document.documentElement.lang=lang==='kz'?'kk':'ru';
  var els=document.querySelectorAll('[data-i]');
  for(var i=0;i<els.length;i++){els[i].textContent=t(els[i].getAttribute('data-i'))}
  var ph=document.querySelectorAll('[data-ip]');
  for(var j=0;j<ph.length;j++){ph[j].placeholder=t(ph[j].getAttribute('data-ip'))}
  $('lRu').className=lang==='ru'?'on':'';
  $('lKz').className=lang==='kz'?'on':'';
  $('coLead').textContent=buildCoLead();
  $('c3p').textContent=t('c3p').replace('$1',CONFIG.legalName);
  $('fCo').textContent=CONFIG.legalName+(CONFIG.bin?' · БИН '+CONFIG.bin:'');
  var c=[];
  if(CONFIG.phoneShow)c.push(CONFIG.phoneShow);
  if(CONFIG.email)c.push(CONFIG.email);
  if(CONFIG.site)c.push(CONFIG.site);
  if(CONFIG.address)c.push(CONFIG.address);
  $('fContacts').textContent=c.join(' · ');
  /* кнопка WhatsApp появляется, только если задан номер */
  var waBox=$('wa').parentNode;
  waBox.style.display=CONFIG.whatsapp?'':'none';
  document.querySelector('[data-i="own"]').textContent=t('own').replace('$1',CONFIG.company);
  updBar();
  paint();
}
function buildCoLead(){
  return lang==='kz'
    ? CONFIG.company+' — қарыз мәселесі бойынша заң көмегі'+(CONFIG.years?', '+CONFIG.years:'')+'.'
    : CONFIG.company+' — юридическая помощь по долгам'+(CONFIG.years?', '+CONFIG.years:'')+'.';
}

function updBar(){
  $('barFill').style.width=(step/TOTAL*100)+'%';
  $('barStep').textContent=t('barStep').replace('$1',step).replace('$2',TOTAL);
}
function paint(){
  var ls=document.querySelectorAll('.ch label, .chips label');
  for(var i=0;i<ls.length;i++){
    var inp=ls[i].querySelector('input');
    if(inp&&inp.checked)ls[i].classList.add('on');else ls[i].classList.remove('on');
  }
}
function show(n){
  step=n;
  var ss=document.querySelectorAll('.stp');
  for(var i=0;i<ss.length;i++)ss[i].classList.toggle('on',ss[i].getAttribute('data-s')==String(n));
  updBar();
  var box=$('wizBox');
  var head=document.querySelector('.top');
  var off=(head?head.offsetHeight:0)+16;
  var y=box.getBoundingClientRect().top+window.pageYOffset-off;
  window.scrollTo({top:y<0?0:y,behavior:'smooth'});
}
function warn(n,msg){
  var w=document.querySelector('.stp[data-s="'+n+'"] [data-w]');
  if(w)w.textContent=msg||'';
}

/* ---------- валидация шагов ---------- */
function validate(n){
  warn(n,'');
  if(n===1){
    if(!radio('ip')||!radio('pay')||!radio('over')||!radio('cnt')){warn(n,t('wNeed'));return false}
    if(!numOf('debt')){warn(n,t('wDebt'));return false}
    if(!numOf('curpay')){warn(n,t('wCur'));return false}
  }
  if(n===2){
    if(!numOf('income')){warn(n,t('wInc'));return false}
    if(!radio('proof')||!radio('susn')){warn(n,t('wNeed'));return false}
  }
  if(n===3){
    if(!radio('home')||!radio('prop')||!radio('pledge')||!radio('sold')){warn(n,t('wNeed'));return false}
    if(radio('sold')==='yes'&&!radio('soldw')){warn(n,t('wNeed'));return false}
  }
  if(n===4){
    if(!radio('docs')||!radio('bet')||!radio('turn')){warn(n,t('wNeed'));return false}
  }
  if(n===5){
    if(!$('fio').value.trim()){warn(n,t('wFio'));return false}
    if($('tel').value.replace(/\D/g,'').length<10){warn(n,t('wTel'));return false}
    if(!radio('when')){warn(n,t('wNeed'));return false}
    if(!$('agree').checked){warn(n,t('wAgree'));return false}
  }
  return true;
}

/* ============================================================
   СЛУЖЕБНЫЙ БАЛЛ — клиент его не видит, он уходит менеджеру
   ============================================================ */
function score(){
  var income=numOf('income'),debt=numOf('debt'),deps=numOf('deps');
  var goals=[];var gs=$('goals').querySelectorAll('input:checked');
  for(var i=0;i<gs.length;i++)goals.push(gs[i].value);

  var stops=[];
  if(radio('ip')==='yes')stops.push('ИП не снят');
  if(radio('bet')==='yes')stops.push('ставки/казино');
  if(radio('proof')==='no')stops.push('доход не подтверждается — нет основания по ст. 6');
  if(radio('sold')==='yes'&&radio('soldw')==='other')stops.push('продажа имущества за 3 года, деньги не на кредиты');

  var prot=PM*(1+deps), spr=Math.max(income-prot,0), R=spr*TERM;
  var cov=debt?R/debt*100:0;
  if(!stops.length&&spr<=0)stops.push('свободного ресурса нет');

  /* платёж по плану: не выше свободного ресурса и не выше того, что нужно для полного гашения */
  var curPay=numOf('curpay');
  var need=debt/TERM;
  var newPay=Math.min(spr,need);
  var totalPlan=Math.round(newPay*TERM);
  var rest=Math.max(debt-totalPlan,0);
  var diff=Math.max(curPay-newPay,0);
  /* Переплата, которую клиент не отдаст.
     Сравниваем не с полными 60 месяцами, а с тем, сколько реально шёл бы текущий график:
     основной долг делим на платёж и добавляем запас на проценты (коэффициент OVERHEAD).
     Иначе клиенту с коротким графиком показалась бы завышенная экономия. */
  var OVERHEAD=1.5;
  var monthsCur=curPay?Math.min(TERM,Math.ceil(debt/curPay*OVERHEAD)):0;
  var save=Math.max(curPay*monthsCur-debt,0);

  var econ={curPay:curPay,newPay:Math.round(newPay),totalPlan:totalPlan,diff:Math.round(diff),save:Math.round(save)};
  if(stops.length)return{stop:stops,score:0,spr:spr,R:R,cov:cov,rest:rest,prot:prot,goals:goals,e:econ};

  var s=50;
  /* имущество */
  var home=radio('home'),prop=radio('prop');
  var extra=(prop==='one'?1:prop==='many'?2:0)+(home==='many'?1:0);
  if(extra>=2)s-=30; else if(extra===1)s-=15; else if(home==='one')s+=15; else s+=25;
  if(radio('pledge')==='yes')s-=25;
  /* происхождение долга */
  if(goals.indexOf('idk')>-1||goals.length===0)s-=25;
  else{var d=radio('docs');s+=(d==='yes'?15:d==='part'?10:5)}
  if(goals.indexOf('lux')>-1)s-=20;
  if(radio('turn')==='yes')s-=20;
  /* платёжная дисциплина — признак добросовестности */
  var pay=radio('pay');s+=(pay==='ok'?10:pay==='late'?5:0);
  /* доход и профиль */
  var pf=radio('proof');s+=(pf==='spr'?10:pf==='part'?-10:0);
  if(radio('susn')==='yes')s+=15;
  if(deps>0)s+=Math.min(deps,2)*3;
  /* покрытие */
  s+=cov>=50?20:cov>=25?10:cov>=10?0:-15;

  return{stop:[],score:Math.max(5,Math.min(95,s)),spr:spr,R:R,cov:cov,rest:rest,prot:prot,goals:goals,e:econ};
}

/* ============================================================
   ОТПРАВКА
   ============================================================ */
function sendToSheet(){
  if(!CONFIG.webhook)return;
  var body=JSON.stringify(dataObj());
  try{
    fetch(CONFIG.webhook,{
      method:'POST',mode:'no-cors',keepalive:true,
      headers:{'Content-Type':'text/plain;charset=utf-8'},body:body
    })['catch'](function(){});
  }catch(e){
    try{
      if(navigator.sendBeacon)navigator.sendBeacon(CONFIG.webhook,new Blob([body],{type:'text/plain;charset=utf-8'}));
    }catch(e2){}
  }
}

function finish(){
  var text=payload();
  sendToSheet();
  var name=$('fio').value.trim().split(/\s+/).slice(-1)[0]||$('fio').value.trim();
  $('thxH').textContent=t('thxH').replace('$1',name);

  /* карточка с цифрами — только если план вообще возможен */
  var r=score();
  if(!r.stop.length&&r.e.newPay>0){
    $('cNewV').textContent=money(r.e.newPay);
    $('cCurV').textContent=r.e.curPay?money(r.e.curPay):'—';
    $('cDiffV').textContent=money(r.e.diff);
    $('rDiff').style.display=r.e.diff>0?'':'none';
    $('cTotalV').textContent=money(r.e.totalPlan);
    $('cRestV').textContent=money(r.rest);
    $('cSaveV').textContent=money(r.e.save);
    $('rSave').style.display=r.e.save>0?'':'none';
    $('calcCard').style.display='';
  } else {
    $('calcCard').style.display='none';
  }
  $('wizBox').style.display='none';
  $('thx').classList.add('on');
  $('wa').onclick=function(){
    window.open('https://wa.me/'+CONFIG.whatsapp+'?text='+encodeURIComponent(text),'_blank');
  };
  var head=document.querySelector('.top');
  var y=$('thx').getBoundingClientRect().top+window.pageYOffset-((head?head.offsetHeight:0)+16);
  window.scrollTo({top:y<0?0:y,behavior:'smooth'});
}

/* ============================================================
   СОБЫТИЯ
   ============================================================ */
['debt','curpay','income','deps'].forEach(function(id){
  var el=$(id);
  el.addEventListener('input',function(){
    var caret=el.selectionStart===null?el.value.length:el.selectionStart;
    var before=el.value.slice(0,caret).replace(/\D/g,'').length;
    var raw=clean(el.value);
    el.value=raw?fmtNum(parseInt(raw,10)):'';
    var pos=0,seen=0;
    while(pos<el.value.length&&seen<before){if(/\d/.test(el.value.charAt(pos)))seen++;pos++}
    try{el.setSelectionRange(pos,pos)}catch(e){}
    warn(step,'');
  });
});
$('tel').addEventListener('input',function(){warn(step,'')});
$('fio').addEventListener('input',function(){warn(step,'')});

document.addEventListener('change',function(e){
  if(e.target&&e.target.type&&(e.target.type==='radio'||e.target.type==='checkbox')){
    paint();warn(step,'');
    if(e.target.name==='sold'){
      var on=e.target.value==='yes';
      $('soldWhy').style.display=on?'':'none';
      if(!on){var rs=document.querySelectorAll('input[name=soldw]');for(var k=0;k<rs.length;k++)rs[k].checked=false;paint()}
    }
  }
});

var nexts=document.querySelectorAll('[data-next]');
for(var i=0;i<nexts.length;i++)nexts[i].addEventListener('click',function(){
  if(validate(step))show(Math.min(step+1,TOTAL));
});
var prevs=document.querySelectorAll('[data-prev]');
for(var j=0;j<prevs.length;j++)prevs[j].addEventListener('click',function(){warn(step,'');show(Math.max(step-1,1))});

$('submit').addEventListener('click',function(){if(validate(5))finish()});
$('lRu').addEventListener('click',function(){lang='ru';applyLang()});
$('lKz').addEventListener('click',function(){lang='kz';applyLang()});

applyLang();
})();
